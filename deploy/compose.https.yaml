name: jobdeck

services:
  jobdeck:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      JOBDECK_HOST: 0.0.0.0
      JOBDECK_PORT: 43120
      JOBDECK_DATA_DIR: /data
      JOBDECK_MULTI_USER: ${JOBDECK_MULTI_USER:-true}
      SUB2API_BASE_URL: ${SUB2API_BASE_URL:-https://sub2api.aibro.vip}
      SUB2API_ADMIN_API_KEY: ${SUB2API_ADMIN_API_KEY:-}
      GITHUB_REPOSITORY: ${GITHUB_REPOSITORY:-userInner/JobDeck}
      STAR_REWARD_USD: ${STAR_REWARD_USD:-5}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - jobdeck_data:/data
    expose:
      - "43120"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - jobdeck
    environment:
      JOBDECK_DOMAIN: ${JOBDECK_DOMAIN:?请在 .env 中设置 JOBDECK_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  jobdeck_data:
  caddy_data:
  caddy_config:
