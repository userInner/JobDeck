<!doctype html>
<html lang="zh-CN">
  <head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>JobDeck 扩展设置</title><link rel="stylesheet" href="options.css" /></head>
  <body><main>
    <p class="eyebrow">LOCAL PAIRING / 本机配对</p><h1>连接 JobDeck</h1>
    <p class="lead">通常无需手动设置：启动本地应用后，在扩展侧边栏点击连接即可。地址与配对码只保存在这台电脑。</p>
    <form id="form">
      <label><span>本地 Web 地址</span><input id="apiUrl" type="url" value="http://127.0.0.1:43120" required /></label>
      <label><span>WebSocket 地址</span><input id="bridgeUrl" type="url" value="ws://127.0.0.1:43120/extension" required /></label>
      <label><span>配对码</span><input id="token" type="password" autocomplete="off" placeholder="由本地工作台自动生成" required /></label>
      <div class="actions"><button type="submit">保存并连接</button><a href="http://127.0.0.1:43120" target="_blank" rel="noreferrer">打开工作台</a></div>
    </form><p id="message" role="status"></p>
    <aside><strong>安全边界</strong><p>扩展不会自动填写密码、助记词、私钥或验证码；每个网站必须单独授权，发送与投递操作默认需要确认。</p></aside>
  </main><script src="options.js"></script></body>
</html>
